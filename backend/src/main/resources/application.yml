spring:
  application:
    name: game-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/gametracker
    username: gametracker
    password: gametracker
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

bgg:
  # BGG requires a registered app's bearer token on every XML API2 request as of Oct 2025
  # (see BggClient's javadoc). Register at boardgamegeek.com to get one, then export
  # BGG_API_TOKEN in your shell before starting the backend. Never commit a real token here.
  api-token: ${BGG_API_TOKEN:}

anthropic:
  # Used to auto-write a one-sentence description for a category/mechanic the first time
  # it's saved and isn't already described (see TagDescriptionService). Get a key at
  # console.anthropic.com, then export ANTHROPIC_API_KEY in your shell before starting the
  # backend. Never commit a real key here. Without one, this feature no-ops — the app is
  # unaffected otherwise.
  api-key: ${ANTHROPIC_API_KEY:}

logging:
  level:
    com.braydenwhitlock.gametracker: DEBUG
